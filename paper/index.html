<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Paper Conquest</title>
    <link rel="stylesheet" href="/paper/style.css?v=20260723m">
</head>
<body>
    <!-- Auth Gate -->
    <div id="auth-gate">
        <div class="loading-screen">
            <h1>Paper Conquest</h1>
            <div class="loading-spinner"></div>
            <p id="loading-status">Loading v2023c...</p>
            <p style="color:#666;font-size:10px;">Build: 2026-07-23 13:18</p>
            <button id="btn-skip-auth" class="btn btn-ghost" style="display:none;margin-top:16px;">Play as Guest</button>
        </div>
    </div>

    <!-- App (hidden until authed) -->
    <div id="app" class="hidden">
        <!-- Menu Screen -->
        <div id="screen-menu" class="screen active">
            <div class="menu-container">
                <h1 class="game-title">Paper Conquest</h1>
                <p class="subtitle">Claim territory. Eliminate opponents.</p>
                <div class="menu-buttons">
                    <button id="btn-play" class="btn btn-primary btn-full btn-tall">Play</button>
                    <button id="btn-loadout" class="btn btn-secondary btn-full">Customize</button>
                    <button id="btn-shop" class="btn btn-secondary btn-full">Shop</button>
                </div>
                <div class="coin-display">
                    <span class="coin-icon">●</span>
                    <span id="menu-coins">0</span> coins
                </div>
            </div>
        </div>

        <!-- Settings Screen (pre-game) -->
        <div id="screen-settings" class="screen">
            <div class="menu-container">
                <h2>Select Level</h2>
                <div id="level-select" class="level-grid"></div>
                <button id="btn-start-game" class="btn btn-primary btn-full btn-tall">Start Game</button>
                <button id="btn-back-menu" class="btn btn-ghost btn-full">Back</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="screen-game" class="screen">
            <canvas id="game-canvas"></canvas>
            <!-- Debug overlay -->
            <div id="debug-overlay" style="position:absolute;top:40px;left:8px;color:#0f0;font:11px monospace;z-index:999;pointer-events:none;background:rgba(0,0,0,0.7);padding:4px 8px;border-radius:4px;"></div>
            <!-- HUD -->
            <div id="hud">
                <div class="hud-top">
                    <span id="hud-timer">2:00</span>
                    <span id="hud-hearts"></span>
                    <span id="hud-territory">0%</span>
                    <span id="hud-kills">0 kills</span>
                    <button id="btn-pause" class="hud-btn">&#9646;&#9646;</button>
                </div>
                <div class="hud-leaderboard" id="hud-leaderboard"></div>
            </div>
            <!-- Virtual Joystick -->
            <div id="joystick-zone"></div>
            <!-- Pause Overlay -->
            <div id="pause-overlay" class="hidden">
                <div class="pause-panel">
                    <h2>Paused</h2>
                    <button id="btn-resume" class="btn btn-primary btn-full">Resume</button>
                    <button id="btn-loadout-pause" class="btn btn-secondary btn-full">Customize</button>
                    <button id="btn-quit-game" class="btn btn-danger btn-full">Quit Game</button>
                </div>
            </div>
        </div>

        <!-- Results Screen -->
        <div id="screen-results" class="screen">
            <div class="menu-container">
                <h2 id="result-title">Game Over</h2>
                <div id="result-stats"></div>
                <div id="result-coins" class="coin-earned"></div>
                <button id="btn-play-again" class="btn btn-primary btn-full btn-tall">Play Again</button>
                <button id="btn-results-menu" class="btn btn-ghost btn-full">Menu</button>
            </div>
        </div>

        <!-- Shop Screen -->
        <div id="screen-shop" class="screen">
            <div class="menu-container">
                <div class="shop-header">
                    <h2>Shop</h2>
                    <span class="coin-display"><span class="coin-icon">●</span> <span id="shop-coins">0</span></span>
                </div>
                <div id="shop-items" class="shop-grid"></div>
                <button id="btn-shop-back" class="btn btn-ghost btn-full">Back</button>
            </div>
        </div>

        <!-- Loadout / Customize Screen -->
        <div id="screen-loadout" class="screen">
            <div class="menu-container">
                <h2>Customize</h2>
                <p class="subtitle">Equip your owned items</p>
                <div id="loadout-items"></div>
                <button id="btn-loadout-back" class="btn btn-ghost btn-full">Back</button>
            </div>
        </div>
    </div>

    <!-- Inline diagnostic - runs before any external scripts -->
    <script>
    window._paperDbg = [];
    window.onerror = function(m,s,l) {
        var el = document.getElementById("loading-status");
        if (el) el.textContent = "JS ERROR: " + m + " (line " + l + " in " + (s||"").split("/").pop() + ")";
        window._paperDbg.push("ERR:" + m);
        return false;
    };
    </script>

    <!-- Auth SDK (site-level) -->
    <script src="/assets/js/learn-auth-sdk.js"></script>
    <script src="/assets/js/auth-service.js"></script>

    <!-- Game Scripts -->
    <script src="/paper/engine.js?v=20260723m"></script>
    <script src="/paper/renderer.js?v=20260723m"></script>
    <script src="/paper/levels.js?v=20260723m"></script>
    <script src="/paper/skins3d.js?v=20260723m"></script>
    <script src="/paper/characters.js?v=20260723m"></script>
    <script src="/paper/effects.js?v=20260723m"></script>
    <script src="/paper/minimap.js?v=20260723m"></script>
    <script src="/paper/tokens.js?v=20260723m"></script>
    <script src="/paper/jackpot.js?v=20260723m"></script>
    <script src="/paper/toasts.js?v=20260723m"></script>
    <script src="/paper/player.js?v=20260723m"></script>
    <script src="/paper/ai.js?v=20260723m"></script>
    <script src="/paper/joystick.js?v=20260723m"></script>
    <script src="/paper/shop.js?v=20260723m"></script>
    <script src="/paper/game.js?v=20260723m"></script>
    <script>
    // Post-load check
    (function() {
        var el = document.getElementById("loading-status");
        var missing = [];
        if (typeof Engine === "undefined") missing.push("Engine");
        if (typeof Renderer === "undefined") missing.push("Renderer");
        if (typeof Skins3DRenderer === "undefined") missing.push("Skins3D");
        if (typeof Player === "undefined") missing.push("Player");
        if (typeof Game === "undefined") missing.push("Game");
        if (typeof SKIN_CATALOG === "undefined") missing.push("Shop");
        if (missing.length > 0) {
            if (el) el.textContent = "FAILED TO LOAD: " + missing.join(", ");
        } else {
            if (el) el.textContent = "All scripts loaded OK";
        }
    })();
    </script>
</body>
</html>
