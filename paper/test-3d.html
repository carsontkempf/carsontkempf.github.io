<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Conquest - 3D Character Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0a0a1a; color: #fff; font-family: system-ui, sans-serif; padding: 16px; }
        h1 { text-align: center; margin-bottom: 8px; font-size: 1.4em; }
        .status { text-align: center; color: #0f0; font-family: monospace; font-size: 12px; margin-bottom: 16px; min-height: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; max-width: 1200px; margin: 0 auto; }
        .card { background: #1a1a2e; border-radius: 12px; padding: 12px; text-align: center; }
        .card canvas { display: block; margin: 0 auto 8px; border-radius: 8px; background: #111; }
        .card h3 { font-size: 0.9em; color: #ccc; }
        .card .info { font-size: 0.7em; color: #666; margin-top: 4px; }
        .controls { text-align: center; margin: 16px 0; }
        .controls button { padding: 8px 16px; margin: 4px; background: #00d2ff; color: #000; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .controls button:hover { background: #33ddff; }
        .test-results { max-width: 800px; margin: 20px auto; background: #111; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 11px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
        .pass { color: #2ed573; }
        .fail { color: #ff4757; }
    </style>
</head>
<body>
    <h1>3D Character Rendering Test</h1>
    <div class="status" id="status">Loading Three.js...</div>
    <div class="controls">
        <button onclick="toggleRotation()">Pause/Resume Rotation</button>
        <button onclick="runTests()">Run Tests</button>
        <button onclick="exportSprites()">Export Sprite Sheet</button>
    </div>
    <div class="grid" id="grid"></div>
    <div class="test-results" id="test-results"></div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.166.0/build/three.module.min.js"
        }
    }
    </script>
    <script type="module" src="skin-renderer.js"></script>
    <script type="module" src="test-3d-runner.js"></script>
</body>
</html>
