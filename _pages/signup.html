---
layout: page
title: Create Account
permalink: /signup/
---

<div id="signup-container">

  <div id="logged-in-panel" style="display:none;">
    <div class="card">
      <h2>Signed In</h2>
      <div class="user-info">
        <p><strong>Name:</strong> <span id="display-name"></span></p>
        <p><strong>Email:</strong> <span id="display-email"></span></p>
      </div>
      <div class="actions">
        <a href="/" class="btn btn-primary">Go to Home</a>
        <button id="signout-btn" class="btn btn-outline">Sign Out</button>
      </div>
    </div>
  </div>

  <div id="auth-panel">
    <div class="card">
      <h2 style="margin:0 0 1.5rem;font-size:1.2rem;font-weight:600;color:#333;">Create Account</h2>

      <div class="form-group">
        <label for="signup-name">Name</label>
        <input type="text" id="signup-name" placeholder="Your name" autocomplete="name">
      </div>
      <div class="form-group">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" placeholder="Minimum 8 characters" autocomplete="new-password">
      </div>
      <button id="signup-btn" class="btn btn-primary full-width">Create Account</button>

      <div id="auth-message" class="message" style="display:none;"></div>

      <div class="divider"><span>or</span></div>
      <button id="google-btn" class="btn btn-google full-width" onclick="googleSignup()">
        <img src="/assets/img/search.png" alt="Google" style="width:1em;height:1em;vertical-align:middle;object-fit:contain;flex-shrink:0;">
        Continue with Google
      </button>

      <p style="text-align:center;margin-top:1.5rem;font-size:0.9rem;color:#666;">
        Already have an account? <a href="/login/" style="color:#007bff;text-decoration:none;">Sign in</a>
      </p>
    </div>
  </div>

</div>

<script src="/assets/js/learn-auth-sdk.js"></script>
<script>
  const AUTH_URL = 'https://cloudprototype.org/api/auth';
  const auth = new AuthSDK({ tenantUrl: AUTH_URL });

  function showMessage(msg, type) {
    const el = document.getElementById('auth-message');
    el.textContent = msg;
    el.className = 'message ' + type;
    el.style.display = 'block';
  }

  function clearMessage() {
    const el = document.getElementById('auth-message');
    el.style.display = 'none';
    el.textContent = '';
  }

  function setLoading(loading) {
    const btn = document.getElementById('signup-btn');
    btn.disabled = loading;
    btn.textContent = loading ? 'Please wait...' : 'Create Account';
  }

  async function checkSession() {
    try {
      const session = await auth.getSession();
      if (session && session.data && session.data.user) {
        showLoggedIn(session.data.user);
      }
    } catch (e) {
      // no active session
    }
  }

  function showLoggedIn(user) {
    document.getElementById('auth-panel').style.display = 'none';
    document.getElementById('logged-in-panel').style.display = 'block';
    document.getElementById('display-name').textContent = user.name || 'N/A';
    document.getElementById('display-email').textContent = user.email;
  }

  document.getElementById('signup-btn').onclick = async () => {
    const name = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;
    if (!name || !email || !password) { showMessage('All fields required.', 'error'); return; }
    if (password.length < 8) { showMessage('Password must be at least 8 characters.', 'error'); return; }
    setLoading(true);
    clearMessage();
    try {
      const result = await auth.signUp(email, password, name);
      if (result.error) throw new Error(result.error.message || 'Sign up failed');
      showMessage('Account created! Signing you in...', 'success');
      setTimeout(() => {
        const redirect = new URLSearchParams(window.location.search).get('redirect') || '/';
        window.location.href = redirect;
      }, 1000);
    } catch (err) {
      showMessage(err.message, 'error');
      setLoading(false);
    }
  };

  document.getElementById('signout-btn').onclick = async () => {
    await auth.signOut();
    document.getElementById('auth-panel').style.display = 'block';
    document.getElementById('logged-in-panel').style.display = 'none';
  };

  ['signup-name', 'signup-email', 'signup-password'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('signup-btn').click();
    });
  });

  async function googleSignup() {
    const btn = document.getElementById('google-btn');
    btn.disabled = true;
    btn.textContent = 'Redirecting...';
    try {
      const redirect = new URLSearchParams(window.location.search).get('redirect');
      const callbackURL = redirect
        ? (redirect.startsWith('http') ? redirect : window.location.origin + redirect)
        : window.location.href;
      await auth.loginWithGoogle(callbackURL);
    } catch(e) {
      showMessage('Google sign-up failed. Try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Continue with Google';
    }
  }

  window.onload = async function() {
    const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    if (hash.has('auth_token')) {
      const token = hash.get('auth_token');
      localStorage.setItem('learn_auth_token', token);
      const userStr = hash.get('auth_user');
      if (userStr) {
        try {
          const user = JSON.parse(decodeURIComponent(userStr));
          showLoggedIn(user);
          window.history.replaceState({}, '', window.location.pathname + window.location.search);
          return;
        } catch(e) {
          console.error('Failed to parse auth_user from hash:', e);
        }
      }
    }
    await checkSession();
  };
</script>
