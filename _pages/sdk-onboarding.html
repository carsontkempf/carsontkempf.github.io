  }

    margin: 0 0 1rem 0;

  .config-row {

  }

  .config-row label {
    display: block;

<div class="sdk-container">
  <div class="sdk-header">
    <h1>SDK Onboarding Test</h1>
    <p>Testing learn-secrets-sdk integration on a static site</p>
  </div>

  <div class="config-section">
    <h2>Configuration</h2>
    <div class="config-row">
      <label for="appId">App ID</label>
      <input type="text" id="appId" placeholder="your-app-id" />
    </div>
    <div class="config-row">
      <label for="sdkToken">SDK Token</label>
      <input type="text" id="sdkToken" placeholder="sk_live_..." />
    </div>
    <div class="config-row">
      <label for="keyName">API Key Name</label>
      <input type="text" id="keyName" value="test-echo" />
    </div>
    <div class="config-row">
      <label for="endpoint">Endpoint</label>
      <input type="text" id="endpoint" value="/get" />
    </div>
  </div>

  <div class="test-section">
    <h2>Test SDK</h2>
    <button class="test-button" id="runTest" onclick="runSDKTest()">
      Run Test
    </button>
    <div class="result-area" id="resultArea">
      <span class="status-badge status-idle">IDLE</span>
      Waiting for test...
    </div>
  </div>

  <div class="log-section">
    <h2>Onboarding Log</h2>
    <div id="logContainer">
      <div class="log-entry">
        <div class="log-time">--:--:--</div>
        <div class="log-message">Ready to test SDK integration</div>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { SecretsSDK } from 'https://unpkg.com/learn-secrets-sdk';

  function addLog(message, type = 'info') {
    const container = document.getElementById('logContainer');
    const time = new Date().toLocaleTimeString();
    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `
      <div class="log-time">${time}</div>
      <div class="log-message ${type}">${message}</div>
    `;
    container.insertBefore(entry, container.firstChild);
  }

  function setResult(status, message) {
    const area = document.getElementById('resultArea');
    const statusClass = {
      idle: 'status-idle',
      loading: 'status-loading',
      success: 'status-success',
      error: 'status-error'
    }[status] || 'status-idle';

    area.innerHTML = `<span class="status-badge ${statusClass}">${status.toUpperCase()}</span>\n${message}`;
  }

  window.runSDKTest = async function() {
    const appId = document.getElementById('appId').value.trim();
    const token = document.getElementById('sdkToken').value.trim();
    const keyName = document.getElementById('keyName').value.trim();
    const endpoint = document.getElementById('endpoint').value.trim();

    // Validation
    if (!appId) {
      addLog('Error: App ID is required', 'error');
      setResult('error', 'App ID is required');
      return;
    }

    if (!token) {
      addLog('Error: SDK Token is required', 'error');
      setResult('error', 'SDK Token is required');
      return;
    }

    if (!token.startsWith('sk_live_')) {
      addLog('Warning: Token should start with sk_live_', 'error');
    }

    addLog(`Initializing SDK with appId: ${appId.substring(0, 8)}...`);
    setResult('loading', 'Initializing SDK...');

    try {
      const sdk = new SecretsSDK({
        appId: appId,
        token: token
      });

      addLog('SDK initialized successfully', 'success');
      addLog(`Making GET request to ${keyName}${endpoint}`);
      setResult('loading', `Calling ${keyName}${endpoint}...`);

      const result = await sdk.get(keyName, endpoint);

      addLog('API call successful!', 'success');
      setResult('success', JSON.stringify(result, null, 2));

      // Log rate limit info
      const usage = sdk.getUsage();
      if (usage) {
        addLog(`Rate limit: ${usage.remaining}/${usage.limit} remaining`);
      }

    } catch (error) {
      addLog(`Error: ${error.message}`, 'error');

      let errorDetails = error.message;
      if (error.status) {
        errorDetails = `Status ${error.status}: ${error.message}`;
      }
      if (error.response) {
        errorDetails += '\n\nResponse:\n' + JSON.stringify(error.response, null, 2);
      }

      setResult('error', errorDetails);

      // Specific error guidance
      if (error.message.includes('Origin')) {
        addLog('Tip: Add this domain to allowed origins in SDK token settings', 'error');
      }
      if (error.status === 401) {
        addLog('Tip: Check your SDK token is valid and not revoked', 'error');
      }
      if (error.status === 404) {
        addLog('Tip: Verify the API key name exists in your project', 'error');
      }
    }
  };

  // Log page load
  addLog('Page loaded, SDK module imported from unpkg CDN', 'success');
  addLog(`Origin: ${window.location.origin}`);
</script>
