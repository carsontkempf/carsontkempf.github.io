layout: page
title: Auth Testing
permalink: /auth-testing/

<div id="auth-test-root">

  <div class="run-panel">
    <div class="url-row">
      <span class="url-label">Auth URL</span>
      <span class="url-value">https://cloudprototype.org/api/auth</span>
      <span class="url-label" style="margin-left:1rem;">SDK</span>
      <span class="url-value">learn-auth-sdk@0.3.1</span>
    </div>
    <div class="input-row">
      <input type="email" id="t-email" placeholder="Email" autocomplete="email" autofocus>
      <input type="password" id="t-password" placeholder="Password" autocomplete="current-password">
      <button id="run-btn" onclick="runSuite()">Run Full Test Suite</button>
    </div>
  </div>

  <div id="results-root" style="display:none;">
    <div id="summary-bar"></div>
    <div id="layers-output"></div>
    <div class="raw-log-panel">
      <div class="raw-log-header">
        <span>Complete Debug Log</span>
        <div class="raw-log-actions">
          <span id="copy-confirm" style="display:none;">Copied.</span>
          <button id="copy-btn" onclick="copyReport()">Copy to Clipboard</button>
        </div>
      </div>
      <pre id="raw-log"></pre>
    </div>
  </div>

</div>

<script src="/assets/js/learn-auth-sdk.js"></script>
<script>
const AUTH_URL = 'https://cloudprototype.org/api/auth';
const TOKEN_KEY = 'learn_auth_token';

let rawLog = [];

function dlog(line) {
  rawLog.push(line);
  const pre = document.getElementById('raw-log');
  if (pre) { pre.textContent += line + '\n'; pre.scrollTop = pre.scrollHeight; }
}

function ts() { return Date.now(); }
function elapsed(s) { return Date.now() - s; }
function fmt(v) { return v === null ? 'null' : v === undefined ? 'undefined' : String(v); }
function trunc(s, n) { s = fmt(s); return s.length > n ? s.slice(0, n) + '...' : s; }
function objKeys(o) { try { return o ? Object.keys(o).join(', ') : 'null'; } catch(e) { return '?'; } }

function r(id, name, pass, detail, ms, warn) {
  return { id, name, pass: !!pass, detail: detail || '', ms, warn: warn || null };
}

function makeTestRow(res) {
  const div = document.createElement('div');
  const cls = res.warn ? 'warn' : (res.pass ? 'pass' : 'fail');
  div.className = 'test-row ' + cls;
  div.innerHTML =
    '<span class="badge ' + cls + '">' + (res.warn ? 'WARN' : (res.pass ? 'PASS' : 'FAIL')) + '</span>' +
    '<span class="test-id">' + escHtml(res.id) + '</span>' +
    '<span class="test-name">' + escHtml(res.name) + '</span>' +
    '<span class="test-ms">' + res.ms + 'ms</span>' +
    '<span class="test-detail">' + escHtml(res.detail) + '</span>';
  return div;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function logResult(res) {
  const tag = res.warn ? '[WARN]' : (res.pass ? '[PASS]' : '[FAIL]');
  dlog('  ' + tag + ' ' + res.id + ' ' + res.name + ' (' + res.ms + 'ms)');
  if (res.detail) dlog('         ' + res.detail);
}

async function runSuite() {
  const email = document.getElementById('t-email').value.trim();
  const password = document.getElementById('t-password').value;
  if (!email || !password) { alert('Email and password required.'); return; }

  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.textContent = 'Running...';

  rawLog = [];
  document.getElementById('raw-log').textContent = '';
  document.getElementById('results-root').style.display = 'none';
  document.getElementById('layers-output').innerHTML = '';
  document.getElementById('summary-bar').innerHTML = '';

  const suiteStart = ts();
  const allTests = [];

  dlog('================================================');
  dlog('learn-auth-sdk Test Suite');
  dlog('Generated : ' + new Date().toLocaleString());
  dlog('Auth URL  : ' + AUTH_URL);
  dlog('User      : ' + email);
  dlog('================================================');

  const layers = [

    // ── Layer 1: SDK & Connectivity ──────────────────────────────────────────
    {
      id: 1,
      name: 'SDK & Connectivity',
      tests: async () => {
        const results = [];
        let auth;
        dlog('\n── Layer 1: SDK & Connectivity ──');

        // 1.1 SDK global loaded
        let t = ts();
        try {
          const type = typeof AuthSDK;
          const ok = type === 'function';
          dlog('  1.1 typeof AuthSDK = "' + type + '"');
          results.push(r('1.1', 'SDK global loaded', ok, 'typeof AuthSDK === "' + type + '"', elapsed(t)));
        } catch(e) { dlog('  1.1 ERROR: ' + e.message); results.push(r('1.1', 'SDK global loaded', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 1.2 SDK instantiates without error
        t = ts();
        try {
          auth = new AuthSDK({ tenantUrl: AUTH_URL });
          const hasGetSession = typeof auth.getSession === 'function';
          const hasSignIn = typeof auth.signIn === 'function';
          const hasGetToken = typeof auth.getToken === 'function';
          dlog('  1.2 auth.getSession=' + hasGetSession + ' auth.signIn=' + hasSignIn + ' auth.getToken=' + hasGetToken);
          const ok = hasGetSession && hasSignIn && hasGetToken;
          results.push(r('1.2', 'SDK instantiates with all methods', ok,
            ok ? 'getSession/signIn/getToken present' : 'missing methods on instance', elapsed(t)));
        } catch(e) { dlog('  1.2 ERROR: ' + e.message); results.push(r('1.2', 'SDK instantiates with all methods', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 1.3 Endpoint reachable (raw fetch)
        t = ts();
        try {
          const res = await fetch(AUTH_URL + '/get-session', {
            method: 'GET',
            headers: { 'Content-Type': 'application/json' }
          });
          const corsOrigin = res.headers.get('access-control-allow-origin');
          const contentType = res.headers.get('content-type');
          dlog('  1.3 status=' + res.status + ' content-type=' + contentType);
          dlog('  1.3 access-control-allow-origin=' + corsOrigin);
          const ok = res.status < 600;
          results.push(r('1.3', 'Auth endpoint reachable', ok, 'HTTP ' + res.status + ', cors=' + (corsOrigin || 'none'), elapsed(t)));
        } catch(e) {
          dlog('  1.3 Network error: ' + e.message);
          results.push(r('1.3', 'Auth endpoint reachable', false, 'Network error: ' + e.message, elapsed(t)));
        }
        logResult(results.at(-1));

        // 1.4 CORS allows carsontkempf.github.io
        t = ts();
        try {
          const res = await fetch(AUTH_URL + '/get-session', {
            method: 'OPTIONS',
            headers: {
              'Origin': 'https://carsontkempf.github.io',
              'Access-Control-Request-Method': 'POST',
              'Access-Control-Request-Headers': 'Content-Type, Authorization'
            }
          });
          const allowOrigin = res.headers.get('access-control-allow-origin');
          const allowCreds = res.headers.get('access-control-allow-credentials');
          const allowHeaders = res.headers.get('access-control-allow-headers');
          dlog('  1.4 OPTIONS status=' + res.status);
          dlog('  1.4 allow-origin=' + allowOrigin);
          dlog('  1.4 allow-credentials=' + allowCreds);
          dlog('  1.4 allow-headers=' + allowHeaders);
          const ok = allowOrigin === 'https://carsontkempf.github.io' || allowOrigin === '*';
          results.push(r('1.4', 'CORS allows github.io origin', ok,
            'allow-origin=' + (allowOrigin || 'none') + ', creds=' + allowCreds, elapsed(t)));
        } catch(e) {
          dlog('  1.4 ERROR: ' + e.message);
          results.push(r('1.4', 'CORS allows github.io origin', false, e.message, elapsed(t)));
        }
        logResult(results.at(-1));

        return { results, state: { auth } };
      }
    },

    // ── Layer 2: Authentication ───────────────────────────────────────────────
    {
      id: 2,
      name: 'Authentication',
      tests: async ({ auth }) => {
        const results = [];
        dlog('\n── Layer 2: Authentication ──');
        dlog('  [INIT] auth methods: signUp=' + typeof auth.signUp + ' signIn=' + typeof auth.signIn + ' signOut=' + typeof auth.signOut);
        dlog('  [INIT] email=' + email + ' password.length=' + password.length);

        // 2.0 Ensure test user exists (sign-up or pre-exists)
        let t = ts();
        dlog('  2.0 START');
        try {
          dlog('  2.0 calling auth.signUp(' + email + ', [password], "Test User")...');
          const upResult = await auth.signUp(email, password, 'Test User');
          dlog('  2.0 signUp returned. type=' + typeof upResult);
          dlog('  2.0 raw result: ' + JSON.stringify(upResult).slice(0, 400));
          const isNew = !upResult.error;
          const errMsg = upResult.error?.message || upResult.error?.code || '';
          const errStatus = upResult.error?.status;
          const alreadyExists = !isNew && (
            errMsg.toLowerCase().includes('exist') ||
            errMsg.toLowerCase().includes('already') ||
            upResult.error?.code === 'USER_ALREADY_EXISTS' ||
            errStatus === 422
          );
          dlog('  2.0 isNew=' + isNew + ' alreadyExists=' + alreadyExists + ' errMsg="' + errMsg + '" errStatus=' + errStatus);
          if (isNew) {
            await auth.signOut().catch(() => {});
            dlog('  2.0 new user created, signed out for clean 2.1 test');
          }
          const ok = isNew || alreadyExists;
          const detail = isNew ? 'new user created' : (alreadyExists ? 'user pre-exists' : 'signup error: ' + errMsg);
          results.push(r('2.0', 'Account setup (new or pre-exists)', ok, detail, elapsed(t), !ok ? 'warn' : null));
        } catch(e) {
          dlog('  2.0 EXCEPTION type=' + (e?.constructor?.name || '?') + ' message=' + (e?.message || String(e)));
          dlog('  2.0 stack: ' + (e?.stack || 'none').slice(0, 300));
          results.push(r('2.0', 'Account setup (new or pre-exists)', false, (e?.message || String(e)), elapsed(t)));
        }
        logResult(results.at(-1));

        // 2.1 Sign in
        t = ts();
        dlog('  2.1 START — calling auth.signIn(' + email + ', [password])...');
        let signInData = null;
        try {
          const result = await auth.signIn(email, password);
          dlog('  2.1 raw result: ' + JSON.stringify(result).slice(0, 500));
          signInData = result.data;
          const ok = !result.error;
          if (ok) {
            dlog('  2.1 sign-in OK. response keys: [' + objKeys(result.data) + ']');
            dlog('  2.1 token present: ' + !!(result.data?.token));
            if (result.data?.user) dlog('  2.1 user keys: [' + objKeys(result.data.user) + ']');
            if (result.data?.user) dlog('  2.1 user.id=' + trunc(result.data.user.id, 16) + ' user.email=' + result.data.user.email + ' user.name=' + result.data.user.name);
          } else {
            dlog('  2.1 sign-in FAILED');
            dlog('  2.1 error.code=' + result.error?.code + ' error.status=' + result.error?.status);
            dlog('  2.1 error.message=' + result.error?.message);
            dlog('  2.1 full error: ' + JSON.stringify(result.error));
          }
          results.push(r('2.1', 'Sign in succeeds', ok,
            ok ? 'user=' + result.data?.user?.email : (result.error?.message || JSON.stringify(result.error)), elapsed(t)));
        } catch(e) {
          dlog('  2.1 EXCEPTION type=' + (e?.constructor?.name || '?') + ' message=' + (e?.message || String(e)));
          results.push(r('2.1', 'Sign in succeeds', false, e.message, elapsed(t)));
        }
        logResult(results.at(-1));

        // 2.2 Bearer token returned and stored
        t = ts();
        try {
          const token = auth.getToken();
          const ok = typeof token === 'string' && token.length >= 10;
          dlog('  2.2 getToken()=' + (token ? trunc(token, 24) + '... (len=' + token.length + ')' : 'null'));
          dlog('  2.2 signIn response had token field: ' + !!(signInData?.token));
          results.push(r('2.2', 'Bearer token stored in SDK', ok,
            ok ? 'len=' + token.length + ' preview=' + token.slice(0,16) + '...' : 'token=' + fmt(token), elapsed(t)));
        } catch(e) { dlog('  2.2 ERROR: ' + e.message); results.push(r('2.2', 'Bearer token stored in SDK', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 2.3 Token persisted to localStorage
        t = ts();
        try {
          const stored = localStorage.getItem(TOKEN_KEY);
          const sdkToken = auth.getToken();
          const ok = stored !== null && stored === sdkToken;
          dlog('  2.3 localStorage["' + TOKEN_KEY + '"]=' + (stored ? trunc(stored, 16) + '...' : 'null'));
          dlog('  2.3 matches SDK token: ' + ok);
          results.push(r('2.3', 'Token persisted to localStorage', ok,
            ok ? 'key="' + TOKEN_KEY + '" matches SDK token' : 'mismatch or null: stored=' + trunc(stored, 10), elapsed(t)));
        } catch(e) { dlog('  2.3 ERROR: ' + e.message); results.push(r('2.3', 'Token persisted to localStorage', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 2.4 Sign-in response contains user object
        t = ts();
        try {
          const user = signInData?.user;
          const hasId = !!(user?.id);
          const hasEmail = !!(user?.email);
          const ok = hasId && hasEmail;
          dlog('  2.4 signIn.data.user: id=' + fmt(user?.id) + ' email=' + fmt(user?.email) + ' name=' + fmt(user?.name));
          dlog('  2.4 emailVerified=' + fmt(user?.emailVerified) + ' createdAt=' + fmt(user?.createdAt) + ' role=' + fmt(user?.role));
          results.push(r('2.4', 'Sign-in response has user object', ok,
            ok ? 'id=' + trunc(user.id, 12) + ' email=' + user.email : 'missing id or email', elapsed(t)));
        } catch(e) { dlog('  2.4 ERROR: ' + e.message); results.push(r('2.4', 'Sign-in response has user object', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        const authFailed = results.find(x => x.id === '2.1') && !results.find(x => x.id === '2.1').pass;
        return { results, state: { auth, signInData }, skip: authFailed };
      }
    },

    // ── Layer 3: Session Validation ──────────────────────────────────────────
    {
      id: 3,
      name: 'Session Validation',
      tests: async ({ auth }) => {
        const results = [];
        let sessionData = null;
        dlog('\n── Layer 3: Session Validation ──');

        // 3.1 getSession returns session object
        let t = ts();
        try {
          const res = await auth.getSession();
          sessionData = res?.data;
          const ok = !!(sessionData?.session);
          dlog('  3.1 getSession() response keys: [' + objKeys(res?.data) + ']');
          if (sessionData?.session) {
            dlog('  3.1 session.id=' + trunc(sessionData.session.id, 16) + ' token=' + trunc(sessionData.session.token, 16) + '...');
            dlog('  3.1 session.createdAt=' + sessionData.session.createdAt + ' expiresAt=' + sessionData.session.expiresAt);
          }
          results.push(r('3.1', 'getSession() returns session', ok,
            ok ? 'id=' + trunc(sessionData.session.id, 16) : 'no session object in response', elapsed(t)));
        } catch(e) { dlog('  3.1 ERROR: ' + e.message); results.push(r('3.1', 'getSession() returns session', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 3.2 User object on session
        t = ts();
        try {
          const user = sessionData?.user;
          const ok = !!(user?.id && user?.email);
          dlog('  3.2 session.user keys: [' + objKeys(user) + ']');
          dlog('  3.2 id=' + fmt(user?.id) + ' email=' + fmt(user?.email) + ' name=' + fmt(user?.name));
          dlog('  3.2 createdAt=' + fmt(user?.createdAt) + ' updatedAt=' + fmt(user?.updatedAt));
          results.push(r('3.2', 'Session has user object', ok,
            ok ? 'id=' + trunc(user.id, 12) + ' email=' + user.email : 'missing user.id or user.email', elapsed(t)));
        } catch(e) { dlog('  3.2 ERROR: ' + e.message); results.push(r('3.2', 'Session has user object', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 3.3 Session email matches input
        t = ts();
        try {
          const sessionEmail = sessionData?.user?.email;
          const ok = sessionEmail === email;
          dlog('  3.3 input email: ' + email);
          dlog('  3.3 session email: ' + sessionEmail);
          dlog('  3.3 match: ' + ok);
          results.push(r('3.3', 'Session email matches input', ok,
            ok ? 'match: ' + email : '"' + sessionEmail + '" !== "' + email + '"', elapsed(t)));
        } catch(e) { dlog('  3.3 ERROR: ' + e.message); results.push(r('3.3', 'Session email matches input', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 3.4 Session not expired
        t = ts();
        try {
          const expiresAt = sessionData?.session?.expiresAt;
          const expDate = expiresAt ? new Date(expiresAt) : null;
          const now = new Date();
          const ok = !!(expDate && expDate > now);
          const daysLeft = expDate ? Math.round((expDate - now) / 86400000) : null;
          dlog('  3.4 expiresAt=' + fmt(expiresAt));
          dlog('  3.4 now=' + now.toISOString() + ' daysLeft=' + daysLeft);
          results.push(r('3.4', 'Session not expired', !!ok,
            ok ? 'expires ' + expDate.toLocaleString() + ' (' + daysLeft + 'd left)' : 'expired or missing expiresAt', elapsed(t)));
        } catch(e) { dlog('  3.4 ERROR: ' + e.message); results.push(r('3.4', 'Session not expired', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 3.5 Bearer header is being sent (verify via a second raw fetch with token)
        t = ts();
        try {
          const token = auth.getToken();
          const res = await fetch(AUTH_URL + '/get-session', {
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token
            }
          });
          const body = await res.json().catch(() => null);
          const user = body?.user || body?.data?.user;
          const ok = res.status === 200 && !!(user?.email);
          dlog('  3.5 raw fetch with Bearer token: status=' + res.status);
          dlog('  3.5 response body keys: [' + objKeys(body) + ']');
          dlog('  3.5 user from raw fetch: ' + fmt(user?.email));
          results.push(r('3.5', 'Bearer token accepted by server', ok,
            ok ? 'raw fetch authenticated as ' + user.email : 'status=' + res.status + ' user=' + fmt(user), elapsed(t)));
        } catch(e) { dlog('  3.5 ERROR: ' + e.message); results.push(r('3.5', 'Bearer token accepted by server', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        return { results, state: { auth, sessionData } };
      }
    },

    // ── Layer 4: Token Persistence ────────────────────────────────────────────
    {
      id: 4,
      name: 'Token Persistence',
      tests: async ({ auth }) => {
        const results = [];
        dlog('\n── Layer 4: Token Persistence ──');

        // 4.1 Token survives SDK re-instantiation
        let t = ts();
        try {
          const originalToken = auth.getToken();
          const auth2 = new AuthSDK({ tenantUrl: AUTH_URL });
          const restoredToken = auth2.getToken();
          const ok = restoredToken !== null && restoredToken === originalToken;
          dlog('  4.1 original token: ' + trunc(originalToken, 20) + '...');
          dlog('  4.1 new instance token: ' + (restoredToken ? trunc(restoredToken, 20) + '...' : 'null'));
          dlog('  4.1 tokens match: ' + ok);
          results.push(r('4.1', 'Token survives SDK re-instantiation', ok,
            ok ? 'token restored from localStorage on new instance' : 'token not restored: ' + fmt(restoredToken), elapsed(t)));
        } catch(e) { dlog('  4.1 ERROR: ' + e.message); results.push(r('4.1', 'Token survives SDK re-instantiation', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 4.2 Re-instantiated SDK can fetch session
        t = ts();
        try {
          const auth2 = new AuthSDK({ tenantUrl: AUTH_URL });
          const session = await auth2.getSession();
          const user = session?.data?.user;
          const ok = !!(user?.email);
          dlog('  4.2 fresh instance getSession() user: ' + fmt(user?.email));
          dlog('  4.2 session.id: ' + fmt(session?.data?.session?.id));
          results.push(r('4.2', 'Re-instantiated SDK session valid', ok,
            ok ? 'session active as ' + user.email : 'no user on session from fresh instance', elapsed(t)));
        } catch(e) { dlog('  4.2 ERROR: ' + e.message); results.push(r('4.2', 'Re-instantiated SDK session valid', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 4.3 localStorage entry exists with correct key
        t = ts();
        try {
          const stored = localStorage.getItem(TOKEN_KEY);
          const allKeys = Object.keys(localStorage).filter(k => k.includes('learn') || k.includes('auth') || k.includes('token'));
          const ok = stored !== null;
          dlog('  4.3 localStorage["' + TOKEN_KEY + '"]: ' + (stored ? 'present (len=' + stored.length + ')' : 'null'));
          dlog('  4.3 related localStorage keys: [' + allKeys.join(', ') + ']');
          results.push(r('4.3', 'localStorage has token key', ok,
            ok ? '"' + TOKEN_KEY + '" present, len=' + stored.length : 'key not found in localStorage', elapsed(t)));
        } catch(e) { dlog('  4.3 ERROR: ' + e.message); results.push(r('4.3', 'localStorage has token key', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        return { results, state: { auth } };
      }
    },

    // ── Layer 5: RBAC ────────────────────────────────────────────────────────
    {
      id: 5,
      name: 'RBAC',
      tests: async ({ auth, sessionData }) => {
        const results = [];
        let roles = [];
        dlog('\n── Layer 5: RBAC ──');

        // 5.1 getRoles() returns array
        let t = ts();
        try {
          roles = await auth.getRoles();
          const ok = Array.isArray(roles);
          dlog('  5.1 getRoles() = [' + roles.join(', ') + '] (Array: ' + ok + ')');
          // Also log the raw user.role and user.roles fields from session
          const rawRole = sessionData?.user?.role;
          const rawRoles = sessionData?.user?.roles;
          dlog('  5.1 session.user.role (singular): ' + fmt(rawRole));
          dlog('  5.1 session.user.roles (array): ' + fmt(rawRoles));
          results.push(r('5.1', 'getRoles() returns array', ok,
            ok ? '[' + roles.join(', ') + '] (' + roles.length + ' roles)' : 'not an array: ' + typeof roles, elapsed(t)));
        } catch(e) { dlog('  5.1 ERROR: ' + e.message); results.push(r('5.1', 'getRoles() returns array', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 5.2 Role count (warn if zero)
        t = ts();
        try {
          const ok = roles.length > 0;
          dlog('  5.2 role count: ' + roles.length);
          results.push(r('5.2', 'User has at least one role', ok,
            ok ? roles.length + ' role(s): [' + roles.join(', ') + ']' : 'no roles assigned (new user default)', elapsed(t), !ok ? 'warn' : null));
        } catch(e) { dlog('  5.2 ERROR: ' + e.message); results.push(r('5.2', 'User has at least one role', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 5.3 hasRole() consistent with getRoles()
        t = ts();
        try {
          if (roles.length > 0) {
            const testRole = roles[0];
            const has = await auth.hasRole(testRole);
            dlog('  5.3 hasRole("' + testRole + '") = ' + has);
            results.push(r('5.3', 'hasRole() consistent with getRoles()', has,
              'hasRole("' + testRole + '") = ' + has, elapsed(t)));
          } else {
            dlog('  5.3 skipped — no roles to verify');
            results.push(r('5.3', 'hasRole() consistent with getRoles()', true, 'skipped — no roles to cross-check', elapsed(t), 'warn'));
          }
        } catch(e) { dlog('  5.3 ERROR: ' + e.message); results.push(r('5.3', 'hasRole() consistent with getRoles()', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 5.4 Check specific role: 'user'
        t = ts();
        try {
          const hasUser = await auth.hasRole('user');
          dlog('  5.4 hasRole("user") = ' + hasUser);
          results.push(r('5.4', 'hasRole("user") check', hasUser,
            'hasRole("user") = ' + hasUser, elapsed(t), !hasUser ? 'warn' : null));
        } catch(e) { dlog('  5.4 ERROR: ' + e.message); results.push(r('5.4', 'hasRole("user") check', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 5.5 Check specific role: 'admin'
        t = ts();
        try {
          const hasAdmin = await auth.hasRole('admin');
          dlog('  5.5 hasRole("admin") = ' + hasAdmin);
          results.push(r('5.5', 'hasRole("admin") check', true,
            'hasRole("admin") = ' + hasAdmin + ' (informational)', elapsed(t), 'warn'));
        } catch(e) { dlog('  5.5 ERROR: ' + e.message); results.push(r('5.5', 'hasRole("admin") check (info)', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 5.6 Unknown role returns false
        t = ts();
        try {
          const has = await auth.hasRole('__nonexistent_xyz__');
          const ok = has === false;
          dlog('  5.6 hasRole("__nonexistent_xyz__") = ' + has + ' (expected false)');
          results.push(r('5.6', 'Unknown role returns false', ok,
            'hasRole("__nonexistent_xyz__") = ' + has, elapsed(t)));
        } catch(e) { dlog('  5.6 ERROR: ' + e.message); results.push(r('5.6', 'Unknown role returns false', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        return { results, state: { auth } };
      }
    },

    // ── Layer 6: Sign Out & Cleanup ───────────────────────────────────────────
    {
      id: 6,
      name: 'Sign Out & Cleanup',
      tests: async ({ auth }) => {
        const results = [];
        dlog('\n── Layer 6: Sign Out & Cleanup ──');

        // 6.1 Sign out does not throw
        let t = ts();
        try {
          await auth.signOut();
          dlog('  6.1 signOut() completed without error');
          results.push(r('6.1', 'signOut() completes without error', true, 'no exception thrown', elapsed(t)));
        } catch(e) { dlog('  6.1 ERROR: ' + e.message); results.push(r('6.1', 'signOut() completes without error', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 6.2 Token cleared from SDK
        t = ts();
        try {
          const token = auth.getToken();
          const ok = token === null;
          dlog('  6.2 getToken() after signOut = ' + fmt(token));
          results.push(r('6.2', 'Token cleared from SDK', ok,
            ok ? 'getToken() === null' : 'token still present: ' + trunc(token, 16), elapsed(t)));
        } catch(e) { dlog('  6.2 ERROR: ' + e.message); results.push(r('6.2', 'Token cleared from SDK', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 6.3 Token cleared from localStorage
        t = ts();
        try {
          const stored = localStorage.getItem(TOKEN_KEY);
          const ok = stored === null;
          dlog('  6.3 localStorage["' + TOKEN_KEY + '"] after signOut = ' + fmt(stored));
          results.push(r('6.3', 'Token cleared from localStorage', ok,
            ok ? 'localStorage key removed' : 'key still present: ' + trunc(stored, 16), elapsed(t)));
        } catch(e) { dlog('  6.3 ERROR: ' + e.message); results.push(r('6.3', 'Token cleared from localStorage', false, e.message, elapsed(t))); }
        logResult(results.at(-1));

        // 6.4 Session returns no user after sign-out
        t = ts();
        try {
          const session = await auth.getSession();
          const user = session?.data?.user;
          const ok = !user;
          dlog('  6.4 getSession() after signOut: user=' + fmt(user?.email));
          dlog('  6.4 session.data keys: [' + objKeys(session?.data) + ']');
          results.push(r('6.4', 'Session cleared after sign-out', ok,
            ok ? 'no user on session after sign-out' : 'user still present: ' + user?.email, elapsed(t)));
        } catch(e) {
          dlog('  6.4 getSession() threw after signOut (counts as cleared): ' + e.message);
          results.push(r('6.4', 'Session cleared after sign-out', true, 'getSession() threw: ' + e.message, elapsed(t)));
        }
        logResult(results.at(-1));

        return { results, state: {} };
      }
    }

  ];

  // ── Run all layers ────────────────────────────────────────────────────────
  let sharedState = {};
  for (const layer of layers) {
    const layerEl = document.createElement('div');
    layerEl.className = 'layer';
    layerEl.innerHTML =
      '<div class="layer-title">Layer ' + layer.id + ': ' + layer.name + '</div>' +
      '<div class="layer-tests" id="lt-' + layer.id + '"></div>';
    document.getElementById('layers-output').appendChild(layerEl);
    const ltEl = document.getElementById('lt-' + layer.id);

    let layerResult;
    try {
      layerResult = await layer.tests(sharedState);
    } catch(e) {
      dlog('  [ERROR] Layer ' + layer.id + ' crashed: ' + e.message);
      ltEl.innerHTML = '<div class="test-row fail"><span class="badge fail">ERROR</span><span class="test-name">Layer crashed</span><span class="test-detail">' + escHtml(e.message) + '</span></div>';
      continue;
    }

    const { results, state, skip } = layerResult;
    if (state) Object.assign(sharedState, state);
    for (const res of results) {
      allTests.push(res);
      ltEl.appendChild(makeTestRow(res));
    }

    if (skip) {
      dlog('\n[SKIPPED] Authentication failed — remaining layers skipped.');
      const skipEl = document.createElement('div');
      skipEl.className = 'skip-notice';
      skipEl.textContent = 'Authentication failed — skipping remaining layers.';
      document.getElementById('layers-output').appendChild(skipEl);
      break;
    }
  }

  // ── Summary ───────────────────────────────────────────────────────────────
  const totalMs = elapsed(suiteStart);
  const passed = allTests.filter(x => x.pass || x.warn).length;
  const failed = allTests.filter(x => !x.pass && !x.warn).length;
  const total = allTests.length;

  dlog('\n================================================');
  dlog('RESULT: ' + passed + '/' + total + ' passed, ' + failed + ' failed (' + totalMs + 'ms)');
  dlog('================================================');

  const summaryEl = document.getElementById('summary-bar');
  summaryEl.className = 'summary-bar ' + (failed === 0 ? 'all-pass' : 'has-fail');
  summaryEl.innerHTML =
    '<span class="summary-count">' + passed + ' / ' + total + ' passed</span>' +
    (failed > 0 ? '<span class="summary-fail">' + failed + ' failed</span>' : '') +
    '<span class="summary-time">' + totalMs + 'ms total</span>';

  document.getElementById('results-root').style.display = 'block';
  btn.disabled = false;
  btn.textContent = 'Run Full Test Suite';

  // Auto-copy
  try {
    await navigator.clipboard.writeText(rawLog.join('\n'));
    const el = document.getElementById('copy-confirm');
    el.textContent = 'Report auto-copied to clipboard.';
    el.style.display = 'inline';
    setTimeout(() => { el.style.display = 'none'; }, 3000);
  } catch(e) {
    // clipboard blocked — user can click the button
  }
}

async function copyReport() {
  try {
    await navigator.clipboard.writeText(rawLog.join('\n'));
    const el = document.getElementById('copy-confirm');
    el.textContent = 'Copied.';
    el.style.display = 'inline';
    setTimeout(() => { el.style.display = 'none'; }, 2000);
  } catch(e) {
    prompt('Copy the report:', rawLog.join('\n'));
  }
}

// Enter key on inputs
document.addEventListener('DOMContentLoaded', () => {
  ['t-email', 't-password'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') runSuite();
    });
  });
});
</script>
