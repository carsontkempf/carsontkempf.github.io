<div id="auth-test-root">

  <div class="run-panel">
    <div class="url-row">
      <span class="url-label">Auth URL</span>
      <span class="url-value">https://cloudprototype.org/api/auth</span>
    </div>
    <div class="input-row">
      <input type="email" id="t-email" placeholder="Email" autocomplete="email" autofocus>
      <input type="password" id="t-password" placeholder="Password" autocomplete="current-password">
      <button id="run-btn" onclick="runSuite()">Run Full Test Suite</button>
    </div>
  </div>

  <div id="results-root" style="display:none;">
    <div id="summary-bar"></div>
    <div id="layers-output"></div>
    <button id="copy-btn" onclick="copyReport()">Copy Report to Clipboard</button>
    <div id="copy-confirm" style="display:none;">Copied to clipboard.</div>
  </div>

</div>

<script src="/assets/js/learn-auth-sdk.js"></script>
<script>
const AUTH_URL = 'https://cloudprototype.org/api/auth';
const TOKEN_KEY = 'learn_auth_token';

let reportLines = [];

function ts() { return Date.now(); }

function elapsed(start) { return Date.now() - start; }

async function runSuite() {
  const email = document.getElementById('t-email').value.trim();
  const password = document.getElementById('t-password').value;
  if (!email || !password) {
    alert('Email and password required.');
    return;
  }

  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  btn.textContent = 'Running...';

  document.getElementById('results-root').style.display = 'none';
  document.getElementById('layers-output').innerHTML = '';
  document.getElementById('summary-bar').innerHTML = '';

  const suiteStart = ts();
  const allTests = [];
  reportLines = [];

  const layers = [
    {
      id: 1,
      name: 'SDK & Connectivity',
      tests: async () => {
        const results = [];
        let auth;

        // 1.1 SDK loaded
        let t = ts();
        try {
          const ok = typeof AuthSDK === 'function';
          results.push(r('1.1', 'SDK loaded', ok, ok ? 'typeof AuthSDK === function' : 'AuthSDK not a function: ' + typeof AuthSDK, elapsed(t)));
        } catch(e) { results.push(r('1.1', 'SDK loaded', false, e.message, elapsed(t))); }

        // 1.2 SDK instantiates
        t = ts();
        try {
          auth = new AuthSDK({ tenantUrl: AUTH_URL });
          results.push(r('1.2', 'SDK instantiates', true, 'new AuthSDK({tenantUrl}) succeeded', elapsed(t)));
        } catch(e) { results.push(r('1.2', 'SDK instantiates', false, e.message, elapsed(t))); }

        // 1.3 Endpoint reachable
        t = ts();
        try {
          const res = await fetch(AUTH_URL + '/get-session', { headers: { 'Content-Type': 'application/json' } });
          const ok = res.status < 600;
          results.push(r('1.3', 'Auth endpoint reachable', ok, 'HTTP ' + res.status + ' (any response = reachable)', elapsed(t)));
        } catch(e) {
          results.push(r('1.3', 'Auth endpoint reachable', false, 'Network error: ' + e.message, elapsed(t)));
        }

        return { results, state: { auth } };
      }
    },
    {
      id: 2,
      name: 'Authentication',
      tests: async ({ auth }) => {
        const results = [];

        // 2.1 Sign in
        let t = ts();
        let signInResult;
        try {
          signInResult = await auth.signIn(email, password);
          const ok = !signInResult.error;
          results.push(r('2.1', 'Sign in returns data', ok,
            ok ? 'Signed in as ' + (signInResult.data?.user?.email || email) : 'Error: ' + (signInResult.error?.message || JSON.stringify(signInResult.error)),
            elapsed(t)));
        } catch(e) { results.push(r('2.1', 'Sign in returns data', false, e.message, elapsed(t))); signInResult = { error: { message: e.message } }; }

        // 2.2 Bearer token stored
        t = ts();
        try {
          const token = auth.getToken();
          const ok = typeof token === 'string' && token.length > 0;
          results.push(r('2.2', 'Bearer token stored in SDK', ok, ok ? 'token[0..19]: ' + token.slice(0, 20) + '...' : 'token is: ' + token, elapsed(t)));
        } catch(e) { results.push(r('2.2', 'Bearer token stored in SDK', false, e.message, elapsed(t))); }

        // 2.3 Token in localStorage
        t = ts();
        try {
          const stored = localStorage.getItem(TOKEN_KEY);
          const token = auth.getToken();
          const ok = stored !== null && stored === token;
          results.push(r('2.3', 'Token persisted to localStorage', ok,
            ok ? 'localStorage["' + TOKEN_KEY + '"] matches SDK token' : 'mismatch — stored: ' + (stored ? stored.slice(0,10)+'...' : 'null') + ' sdk: ' + (token ? token.slice(0,10)+'...' : 'null'),
            elapsed(t)));
        } catch(e) { results.push(r('2.3', 'Token persisted to localStorage', false, e.message, elapsed(t))); }

        // 2.4 Token format valid
        t = ts();
        try {
          const token = auth.getToken();
          const ok = typeof token === 'string' && token.length >= 10;
          results.push(r('2.4', 'Token format valid', ok, ok ? 'length: ' + token.length + ' chars' : 'token too short or wrong type: ' + token, elapsed(t)));
        } catch(e) { results.push(r('2.4', 'Token format valid', false, e.message, elapsed(t))); }

        const authFailed = results.some(x => x.id === '2.1' && !x.pass);
        return { results, state: { auth }, skip: authFailed };
      }
    },
    {
      id: 3,
      name: 'Session Validation',
      tests: async ({ auth }) => {
        const results = [];
        let session;

        // 3.1 Session exists
        let t = ts();
        try {
          session = await auth.getSession();
          const ok = !!(session && session.data && session.data.session);
          results.push(r('3.1', 'Session exists', ok, ok ? 'session id: ' + session.data.session.id : 'no session data returned', elapsed(t)));
        } catch(e) { results.push(r('3.1', 'Session exists', false, e.message, elapsed(t))); }

        // 3.2 User data present
        t = ts();
        try {
          const user = session && session.data && session.data.user;
          const ok = !!(user && user.id && user.email);
          results.push(r('3.2', 'User data present', ok, ok ? 'id: ' + user.id.slice(0,12) + '..., email: ' + user.email : 'missing id or email on user object', elapsed(t)));
        } catch(e) { results.push(r('3.2', 'User data present', false, e.message, elapsed(t))); }

        // 3.3 Email matches
        t = ts();
        try {
          const sessionEmail = session && session.data && session.data.user && session.data.user.email;
          const ok = sessionEmail === email;
          results.push(r('3.3', 'Session email matches input', ok,
            ok ? 'email matches: ' + email : 'expected "' + email + '" got "' + sessionEmail + '"',
            elapsed(t)));
        } catch(e) { results.push(r('3.3', 'Session email matches input', false, e.message, elapsed(t))); }

        // 3.4 Session not expired
        t = ts();
        try {
          const expiresAt = session && session.data && session.data.session && session.data.session.expiresAt;
          const ok = expiresAt && new Date(expiresAt) > new Date();
          results.push(r('3.4', 'Session not expired', !!ok,
            ok ? 'expires: ' + new Date(expiresAt).toLocaleString() : 'no expiresAt or already expired: ' + expiresAt,
            elapsed(t)));
        } catch(e) { results.push(r('3.4', 'Session not expired', false, e.message, elapsed(t))); }

        return { results, state: { auth, session } };
      }
    },
    {
      id: 4,
      name: 'RBAC',
      tests: async ({ auth }) => {
        const results = [];
        let roles = [];

        // 4.1 getRoles returns array
        let t = ts();
        try {
          roles = await auth.getRoles();
          const ok = Array.isArray(roles);
          results.push(r('4.1', 'getRoles() returns array', ok, ok ? 'roles: [' + roles.join(', ') + ']' : 'returned: ' + typeof roles, elapsed(t)));
        } catch(e) { results.push(r('4.1', 'getRoles() returns array', false, e.message, elapsed(t))); }

        // 4.2 Has at least one role (warn if empty)
        t = ts();
        try {
          const ok = roles.length > 0;
          results.push(r('4.2', 'Has at least one role', ok, ok ? roles.length + ' role(s): ' + roles.join(', ') : 'user has no roles assigned (new user)', elapsed(t), !ok ? 'warn' : null));
        } catch(e) { results.push(r('4.2', 'Has at least one role', false, e.message, elapsed(t))); }

        // 4.3 hasRole() consistent with getRoles()
        t = ts();
        try {
          if (roles.length > 0) {
            const testRole = roles[0];
            const has = await auth.hasRole(testRole);
            results.push(r('4.3', 'hasRole() consistent with getRoles()', has, 'hasRole("' + testRole + '") returned ' + has, elapsed(t)));
          } else {
            results.push(r('4.3', 'hasRole() consistent with getRoles()', true, 'skipped — no roles to verify (pass by default)', elapsed(t), 'warn'));
          }
        } catch(e) { results.push(r('4.3', 'hasRole() consistent with getRoles()', false, e.message, elapsed(t))); }

        // 4.4 Unknown role returns false
        t = ts();
        try {
          const has = await auth.hasRole('__nonexistent_role_xyz__');
          const ok = has === false;
          results.push(r('4.4', 'Unknown role returns false', ok, 'hasRole("__nonexistent_role_xyz__") = ' + has, elapsed(t)));
        } catch(e) { results.push(r('4.4', 'Unknown role returns false', false, e.message, elapsed(t))); }

        return { results, state: { auth } };
      }
    },
    {
      id: 5,
      name: 'Sign Out & Cleanup',
      tests: async ({ auth }) => {
        const results = [];

        // 5.1 Sign out succeeds
        let t = ts();
        try {
          await auth.signOut();
          results.push(r('5.1', 'Sign out succeeds', true, 'signOut() completed without error', elapsed(t)));
        } catch(e) { results.push(r('5.1', 'Sign out succeeds', false, e.message, elapsed(t))); }

        // 5.2 Token cleared from SDK
        t = ts();
        try {
          const token = auth.getToken();
          const ok = token === null;
          results.push(r('5.2', 'Token cleared from SDK', ok, ok ? 'getToken() === null' : 'token still present after sign-out: ' + token, elapsed(t)));
        } catch(e) { results.push(r('5.2', 'Token cleared from SDK', false, e.message, elapsed(t))); }

        // 5.3 Session cleared
        t = ts();
        try {
          const session = await auth.getSession();
          const user = session && session.data && session.data.user;
          const ok = !user;
          results.push(r('5.3', 'Session cleared after sign-out', ok, ok ? 'getSession() returns no user' : 'user still in session: ' + (user && user.email), elapsed(t)));
        } catch(e) {
          // Some auth impls throw on empty session — that counts as cleared
          results.push(r('5.3', 'Session cleared after sign-out', true, 'getSession() threw (session cleared): ' + e.message, elapsed(t)));
        }

        return { results, state: {} };
      }
    }
  ];

  // Run layers
  let sharedState = {};
  for (const layer of layers) {
    const layerEl = document.createElement('div');
    layerEl.className = 'layer';
    layerEl.id = 'layer-' + layer.id;
    layerEl.innerHTML = '<div class="layer-title">Layer ' + layer.id + ': ' + layer.name + '</div><div class="layer-tests" id="lt-' + layer.id + '"></div>';
    document.getElementById('layers-output').appendChild(layerEl);

    const ltEl = document.getElementById('lt-' + layer.id);

    let layerResult;
    try {
      layerResult = await layer.tests(sharedState);
    } catch(e) {
      ltEl.innerHTML = '<div class="test-row fail"><span class="badge fail">ERROR</span><span class="test-name">Layer ' + layer.id + ' crashed</span><span class="test-detail">' + escHtml(e.message) + '</span></div>';
      reportLines.push('\nLayer ' + layer.id + ': ' + layer.name);
      reportLines.push('  [ERROR] Layer crashed: ' + e.message);
      continue;
    }

    const { results, state, skip } = layerResult;
    if (state) Object.assign(sharedState, state);

    reportLines.push('\nLayer ' + layer.id + ': ' + layer.name);

    for (const res of results) {
      allTests.push(res);
      ltEl.appendChild(makeTestRow(res));
      reportLines.push('  [' + (res.warn ? 'WARN' : (res.pass ? 'PASS' : 'FAIL')) + '] ' + res.id + ' ' + res.name + ' (' + res.ms + 'ms)' + (res.detail ? ' — ' + res.detail : ''));
    }

    if (skip) {
      const skipMsg = document.createElement('div');
      skipMsg.className = 'skip-notice';
      skipMsg.textContent = 'Authentication failed — skipping remaining layers.';
      document.getElementById('layers-output').appendChild(skipMsg);
      reportLines.push('\n[SKIPPED] Authentication failed — remaining layers skipped.');
      break;
    }
  }

  // Summary
  const totalMs = elapsed(suiteStart);
  const passed = allTests.filter(x => x.pass || x.warn).length;
  const failed = allTests.filter(x => !x.pass && !x.warn).length;
  const total = allTests.length;

  const summaryEl = document.getElementById('summary-bar');
  summaryEl.className = 'summary-bar ' + (failed === 0 ? 'all-pass' : 'has-fail');
  summaryEl.innerHTML =
    '<span class="summary-count">' + passed + ' / ' + total + ' passed</span>' +
    (failed > 0 ? '<span class="summary-fail">' + failed + ' failed</span>' : '') +
    '<span class="summary-time">' + totalMs + 'ms total</span>';

  // Build report header
  const header = [
    'learn-auth-sdk Test Report',
    'Generated: ' + new Date().toLocaleString(),
    'Auth URL: ' + AUTH_URL,
    'User: ' + email,
    'Result: ' + passed + '/' + total + ' passed (' + totalMs + 'ms)',
  ];
  reportLines = header.concat(reportLines);

  document.getElementById('results-root').style.display = 'block';
  btn.disabled = false;
  btn.textContent = 'Run Full Test Suite';
}

function r(id, name, pass, detail, ms, warn) {
  return { id, name, pass: !!pass, detail: detail || '', ms, warn: warn || null };
}

function makeTestRow(res) {
  const div = document.createElement('div');
  div.className = 'test-row ' + (res.warn ? 'warn' : (res.pass ? 'pass' : 'fail'));
  div.innerHTML =
    '<span class="badge ' + (res.warn ? 'warn' : (res.pass ? 'pass' : 'fail')) + '">' +
    (res.warn ? 'WARN' : (res.pass ? 'PASS' : 'FAIL')) + '</span>' +
    '<span class="test-id">' + escHtml(res.id) + '</span>' +
    '<span class="test-name">' + escHtml(res.name) + '</span>' +
    '<span class="test-ms">' + res.ms + 'ms</span>' +
    '<span class="test-detail">' + escHtml(res.detail) + '</span>';
  return div;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function copyReport() {
  const text = reportLines.join('\n');
  try {
    await navigator.clipboard.writeText(text);
    const el = document.getElementById('copy-confirm');
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 2000);
  } catch(e) {
    prompt('Copy the report below:', text);
  }
}
</script>
