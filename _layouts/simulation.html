<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <style>
      body { margin: 0; background: #0a0c12; color: #c8d2dc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", monospace; }
      .sim-nav { display: flex; justify-content: space-between; padding: 8px 16px; background: #12161e; border-bottom: 1px solid #2d3340; font-size: 13px; }
      .sim-nav a { color: #00b4dc; text-decoration: none; }
      .sim-nav a:hover { text-decoration: underline; }
      .sim-container { display: flex; height: calc(100vh - 40px); }
      .lesson-panel { width: 38%; overflow-y: auto; padding: 24px; background: #12161e; border-right: 1px solid #2d3340; }
      .lesson-panel h2 { color: #f0f5ff; font-size: 16px; margin-top: 20px; }
      .lesson-panel h3 { color: #00b4dc; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-top: 18px; }
      .lesson-panel p { line-height: 1.7; font-size: 13px; }
      .lesson-panel code { background: #1e2530; padding: 2px 6px; border-radius: 3px; color: #50dc64; }
      .sim-panel { width: 62%; display: flex; flex-direction: column; }
      .sim-canvas { flex: 1; width: 100%; }
      .sim-controls { padding: 10px 16px; background: #141820; border-top: 1px solid #2d3340; }
      .insight-box { border-left: 3px solid #00b4dc; padding: 10px 14px; margin-top: 16px; background: #1a1f2a; border-radius: 0 4px 4px 0; }
      .insight-box strong { color: #00b4dc; }
      .history-box { border-left: 3px solid #ff9040; padding: 10px 14px; margin-top: 12px; background: #1f1a14; border-radius: 0 4px 4px 0; }
      .history-box strong { color: #ff9040; }
    </style>
  </head>
  <body>
    <nav class="sim-nav">
      <a href="{{ '/physics/' | relative_url }}">< All Modules</a>
      <span>{{ page.title }}</span>
      {% if page.next_module %}<a href="{{ page.next_module | relative_url }}">Next Module ></a>{% endif %}
    </nav>
    <div class="sim-container">
      <div class="lesson-panel">
        {{ content }}
      </div>
      <div class="sim-panel">
        <canvas id="sim-canvas" class="sim-canvas"></canvas>
        <div class="sim-controls" id="controls"></div>
      </div>
    </div>
    <script type="module">
      async function run() {
        const canvas = document.getElementById('sim-canvas');
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        try {
          const mod = await import('{{ "/assets/wasm/" | append: page.wasm_module | append: "/" | append: page.wasm_module | append: ".js" | relative_url }}');
          await mod.default();
          mod.start(canvas, document.getElementById('controls'));
        } catch (e) {
          const ctx = canvas.getContext('2d');
          ctx.fillStyle = '#1a1f2a';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#5a6070';
          ctx.font = '14px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('Simulation not available', canvas.width / 2, canvas.height / 2 - 10);
          ctx.fillText('WASM module pending deployment', canvas.width / 2, canvas.height / 2 + 10);
        }
      }
      run();
    </script>
  </body>
</html>
